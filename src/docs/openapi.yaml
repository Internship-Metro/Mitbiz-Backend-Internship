openapi: 3.0.3
info:
  title: Mitbiz API
  version: 1.0.0
  description: >-
    Dokumentasi Resmi API Backend Mitbiz POS & Multi-Outlet. Seluruh endpoint, request, dan response disesuaikan dengan
    kebutuhan aplikasi.
  license:
    name: Proprietary
servers:
  - url: 'https://mitbiz-backend-internship-production.up.railway.app/api/v1'
    description: Production Server
  - url: 'http://localhost:3000/api/v1'
    description: Local Development Server
tags:
