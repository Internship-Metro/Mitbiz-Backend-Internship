openapi: 3.0.3
info:
  title: Mitbiz API
  version: 1.0.0
  description: Dokumentasi Resmi API Backend Mitbiz POS. Seluruh endpoint,
    request, dan response disesuaikan dengan kebutuhan aplikasi."
  license:
    name: Proprietary
servers:
  - url: https://mitbiz-backend-internship-production.up.railway.app/api/v1
    description: Production Server
  - url: http://localhost:3000/api/v1
    description: Local Development Server
tags:
  - name: Auth
    description: Autentikasi & Registrasi Pengguna
  - name: Manajemen Cabang (By Non - Super Admin)
    description: Kelola Cabang Milik Bisnis Sendiri
  - name: Manajemen Cabang (By Super Admin)
    description: Kelola Seluruh Cabang oleh Super Admin
  - name: Manajemen Karyawan (By Non - Super Admin)
    description: Kelola Staff / Kasir Cabang
  - name: Manajemen User (By Super Admin)
    description: Kelola Pengguna Sistem oleh Super Admin
  - name: Category
    description: Kelola Kategori Produk
  - name: Product
    description: Kelola Katalog Produk
  - name: Roles
    description: Kelola Role & Hak Akses Pengguna
  - name: Payment Method
    description: Kelola Metode Pembayaran Global & Cabang
  - name: Pengaturan
    description: Konfigurasi Sistem & Profil Toko
  - name: Stock
    description: Manajemen & Mutasi Stok Barang
  - name: Shift
    description: Manajemen Shift Operasional Kasir
  - name: Transaction
    description: Transaksi Penjualan POS & Pelunasan
  - name: Dashboard
    description: Statistik & Ringkasan Dashboard
  - name: Laporan
    description: Laporan Penjualan, Stok, & Ekspor PDF/Excel
  - name: Paket Langganan
    description: Kelola Paket Langganan Platform (CRUD oleh Super Admin)
  - name: Subscription & Payment
    description: Berlangganan Paket & Riwayat Pembayaran via Midtrans (Admin Bisnis)
