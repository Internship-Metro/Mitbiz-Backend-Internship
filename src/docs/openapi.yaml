  /staff:
    post:
      tags:
        - Manajemen Karyawan (By Non - Super Admin)
      summary: Buat Akun Karyawan Baru
      description: |
        Buat akun kasir/staff baru untuk bisnis sendiri.
        
        **🔒 Butuh langganan aktif.**
        
        **Validasi batas kasir:**  
        Jika jumlah kasir aktif sudah mencapai batas `maxKasir` dari paket langganan,
        request akan ditolak dengan HTTP 403 beserta pesan informatif.
      operationId: Manajemen_Karyawan__By_Non___Super_Admin__Buat_Akun_Karyawan_Baru_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              example:
                name: Anisa Supervisor
                username: anisasupervisor
                password: password123
                phone: "0812345678"
                roleId: cmsohbgh500013ij99mjzqtgq
                outletId: cmsoaq6zh000013zak24rgbgz
      responses:
        "200":
          description: Akun karyawan berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          description: "Bad Request / Validasi Gagal (username duplikat, outlet tidak valid, dll)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Unauthorized / Token Tidak Valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: |
            Forbidden - salah satu dari:
            1. Bisnis belum punya langganan aktif / sudah expired
            2. Jumlah kasir sudah mencapai batas maksimal paket
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/SubscriptionRequiredError"
                  - $ref: "#/components/schemas/LimitExceededError"
              examples:
                noSubscription:
                  summary: Belum punya langganan
                  value:
                    success: false
                    message: "Bisnis Anda belum memiliki paket langganan aktif."
                limitExceeded:
                  summary: Batas kasir tercapai
                  value:
                    success: false
                    message: "Paket Anda hanya mengizinkan 3 kasir. Upgrade paket untuk menambah lebih banyak."
      security:
        - bearerAuth: []
    get:
      tags:
        - Manajemen Karyawan (By Non - Super Admin)
      summary: Lihat Daftar  Staff
      description: "Lihat Daftar  Staff - Folder: Manajemen Karyawan (By Non - Super Admin)"
