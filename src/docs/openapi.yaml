components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Token JWT diisi pada Authorization header (Format: Bearer <token>)'
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Berhasil melakukan operasi
        data:
          type: object
          nullable: true
        total:
          type: integer
          example: 10
    ApiErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Pesan kesalahan
        errors:
          type: array
          items:
            type: object
          nullable: true
