  /subscriptions/subscribe:
    post:
      tags:
        - Subscription & Payment
      summary: Berlangganan Paket
      description: Admin Bisnis — pilih paket dan buat transaksi Midtrans. Response
        berisi `snapToken` dan `redirectUrl` untuk proses pembayaran di
        frontend.
      operationId: Subscription_Subscribe_post
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              example:
                packageId: cmc1234567890abcdef
      responses:
        "201":
          description: Transaksi pembayaran berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: Transaksi pembayaran berhasil dibuat
                  data:
                    orderId: SUB-1721300000000-abc123
                    snapToken: 66e4fa55-fdac-4ef9-91b5-733b97d1b862
                    redirectUrl: https://app.sandbox.midtrans.com/snap/v2/vtweb/66e4fa55-fdac-4ef9-91b5-733b97d1b862
                    package:
                      id: cmc1234567890abcdef
                      name: Paket Starter
                      price: 99000
                      billingCycle: MONTHLY
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Forbidden — bukan ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Paket tidak ditemukan atau nonaktif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /subscriptions/webhook:
    post:
      tags:
        - Subscription & Payment
      summary: Webhook Notifikasi Midtrans (PUBLIC)
      description: Endpoint PUBLIC — dipanggil otomatis oleh server Midtrans setelah
        pembayaran berhasil/gagal/expired. TIDAK perlu Authorization header.
        Keamanan dijamin oleh verifikasi signature key Midtrans di dalam
        service.
      operationId: Subscription_Webhook_post
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Payload notifikasi dari Midtrans
              example:
                transaction_status: settlement
                order_id: SUB-1721300000000-abc123
                gross_amount: "99000.00"
                payment_type: bank_transfer
                fraud_status: accept
      responses:
        "200":
          description: Notifikasi berhasil diproses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "404":
          description: orderId tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /subscriptions/my:
    get:
      tags:
