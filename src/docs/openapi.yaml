  /packages:
    get:
      tags:
        - Paket Langganan
      summary: Lihat Semua Paket Aktif
      description: Publik — tampilkan semua paket yang isActive = true. Super Admin
        dapat kirim query ?all=true untuk melihat semua termasuk yang nonaktif.
      operationId: Package_GetAll_get
      security: []
      parameters:
        - name: all
          in: query
          required: false
          schema:
            type: boolean
          description: Jika true dan login sebagai SUPER_ADMIN, tampilkan semua paket
            (aktif + nonaktif)
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
    post:
      tags:
        - Paket Langganan
      summary: Buat Paket Baru
      description: Super Admin only — buat paket beserta daftar fiturnya.
      operationId: Package_Create_post
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              example:
                name: Paket Starter
                description: Paket terjangkau untuk bisnis kecil dengan 1 cabang dan 3 kasir.
                price: 99000
                billingCycle: MONTHLY
                maxBranches: 1
                maxKasir: 3
                isActive: true
                features:
                  - Manajemen Produk
                  - Laporan Harian
                  - POS Kasir
      responses:
        "201":
          description: Paket berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          description: Bad Request / Validasi Gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Forbidden — bukan SUPER_ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: Conflict — nama paket sudah ada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
