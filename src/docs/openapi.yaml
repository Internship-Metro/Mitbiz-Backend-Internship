      tags:
        - Paket Langganan
      summary: Hapus / Nonaktifkan Paket
      description: Super Admin only â€” jika masih ada bisnis aktif yang memakai paket
        ini, paket hanya dinonaktifkan (isActive=false). Jika tidak ada, dihapus
        permanen.
      operationId: Package_Delete_delete
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: cmc1234567890abcdef
      responses:
        "200":
          description: Paket berhasil dihapus atau dinonaktifkan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Paket tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /subscriptions/subscribe:
    post:
      tags:
        - Subscription & Payment
      summary: Berlangganan Paket
      description: Admin Bisnis â€” pilih paket dan buat transaksi Midtrans. Response
        berisi `snapToken` dan `redirectUrl` untuk proses pembayaran di
        frontend.
      operationId: Subscription_Subscribe_post
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              example:
                packageId: cmc1234567890abcdef
      responses:
        "201":
          description: Transaksi pembayaran berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: Transaksi pembayaran berhasil dibuat
                  data:
                    orderId: SUB-1721300000000-abc123
                    snapToken: 66e4fa55-fdac-4ef9-91b5-733b97d1b862
                    redirectUrl: https://app.sandbox.midtrans.com/snap/v2/vtweb/66e4fa55-fdac-4ef9-91b5-733b97d1b862
                    package:
                      id: cmc1234567890abcdef
                      name: Paket Starter
                      price: 99000
                      billingCycle: MONTHLY
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Forbidden â€” bukan ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Paket tidak ditemukan atau nonaktif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /subscriptions/my:
    get:
      tags:
        - Subscription & Payment
      summary: Status Langganan Aktif Saya
      description: Admin Bisnis â€” lihat status langganan paket yang sedang aktif untuk
        bisnis yang sedang login, termasuk sisa hari.
      operationId: Subscription_GetMy_get
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  data:
                    hasActiveSubscription: true
                    subscription:
                      id: cmc...
                      status: ACTIVE
                      startDate: 2026-08-18T00:00:00Z
                      endDate: 2026-09-18T00:00:00Z
                      isExpired: false
                      daysRemaining: 30
                      package:
                        name: Paket Starter
                        features: []
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /subscriptions/history:
    get:
      tags:
        - Subscription & Payment
      summary: Riwayat Pembayaran Saya
      description: Admin Bisnis â€” lihat semua riwayat transaksi pembayaran paket
        (PENDING, SUCCESS, FAILED, EXPIRED) milik bisnis yang sedang login.
      operationId: Subscription_GetHistory_get
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  data:
                    - id: cmc...
                      orderId: SUB-1721300000000-abc123
                      grossAmount: 99000
                      paymentStatus: SUCCESS
                      paymentType: bank_transfer
                      paidAt: 2026-08-18T05:00:00Z
                      package:
                        name: Paket Starter
                        billingCycle: MONTHLY
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /pos/config:
    get:
      tags:
        - Transaction
      summary: Get POS Config (Tax & Discount)
      operationId: Pos_Get_Config_get
      description: API khusus untuk kasir mengambil konfigurasi pajak dan diskon global sebelum memulai transaksi.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Berhasil mengambil konfigurasi
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      tax:
                        type: object
                        properties:
                          isEnabled:
                            type: boolean
                            example: true
                          percentage:
                            type: number
                            example: 11
                      discount:
                        type: object
                        properties:
                          isEnabled:
                            type: boolean
                            example: true
                          percentage:
                            type: number
                            example: 10
                          minPurchase:
                            type: number
                            example: 50000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Token JWT diisi pada Authorization header (Format: Bearer <token>)"
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Berhasil melakukan operasi
        data:
          type: object
          nullable: true
        total:
          type: integer
          example: 10
    ApiErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Pesan kesalahan
        errors:
          type: array
          items:
            type: object
          nullable: true
    SubscriptionRequiredError:
      type: object
      description: |
        Error yang dikembalikan saat bisnis belum punya langganan aktif
        atau langganannya sudah expired. Semua endpoint operasional
        (produk, outlet, stok, transaksi, dll) akan mengembalikan ini
        jika tidak ada langganan aktif.
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Bisnis Anda belum memiliki paket langganan aktif. Silakan beli paket untuk menggunakan fitur ini."
    LimitExceededError:
      type: object
      description: |
        Error yang dikembalikan saat bisnis mencoba menambah cabang/kasir
        melebihi batas paket langganan yang aktif.
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Paket \"Paket Basic\" Anda hanya mengizinkan maksimal 2 cabang. Anda sudah memiliki 2 cabang. Upgrade paket untuk menambah lebih banyak cabang."
    ActivePackageInfo:
      type: object
      nullable: true
      description: Detail paket langganan aktif. Null jika tidak ada langganan aktif atau user adalah Super Admin.
      properties:
        id:
          type: string
          example: clxxx456
        name:
          type: string
          example: Paket Pro
        billingCycle:
          type: string
          enum: [MONTHLY, YEARLY]
          example: MONTHLY
        maxBranches:
          type: integer
          description: Batas maksimal jumlah cabang yang boleh dibuat
          example: 5
        maxKasir:
          type: integer
          description: Batas maksimal jumlah akun kasir yang boleh dibuat
          example: 10
        endDate:
          type: string
          format: date-time
          description: Tanggal berakhirnya langganan
          example: "2026-09-20T00:00:00.000Z"
        daysRemaining:
          type: integer
          description: Sisa hari langganan aktif
          example: 31
    UserProfile:
      type: object
      properties:
        id:
          type: string
          example: clxxx123
        name:
          type: string
          example: Daffarael
        email:
          type: string
          nullable: true
          example: daffarael351@gmail.com
        role:
          type: string
          enum: [SUPER_ADMIN, ADMIN, STAFF]
          example: ADMIN
        businessId:
          type: string
          nullable: true
        outletId:
          type: string
          nullable: true
