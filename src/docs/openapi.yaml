    post:
      tags:
        - Manajemen Cabang (By Non - Super Admin)
      summary: Tambah Cabang Baru Bisnis Sendiri
      description: |
        Buat cabang baru untuk bisnis sendiri.
        
        **🔒 Butuh langganan aktif.**
        
        **Validasi batas cabang:**  
        Jika jumlah cabang aktif sudah mencapai batas `maxBranches` dari paket langganan,
        request akan ditolak dengan HTTP 403 beserta pesan informatif.
        
        Super Admin tidak dikenakan batas ini.
      operationId: Manajemen_Cabang__By_Non___Super_Admin__Tambah_Cabang_Baru_Bisnis_Sendiri_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              example:
                name: Elwai Bandar Buat
                address: Jl. Manunggal No 12
                phone: "081234567487"
      responses:
        "200":
          description: Cabang berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          description: Bad Request / Validasi Gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Unauthorized / Token Tidak Valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: |
            Forbidden — salah satu dari:
            1. Bisnis belum punya langganan aktif / sudah expired
            2. Jumlah cabang sudah mencapai batas maksimal paket
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/SubscriptionRequiredError"
                  - $ref: "#/components/schemas/LimitExceededError"
              examples:
                noSubscription:
                  summary: Belum punya langganan
                  value:
                    success: false
                    message: "Bisnis Anda belum memiliki paket langganan aktif. Silakan beli paket untuk menggunakan fitur ini."
                limitExceeded:
                  summary: Batas cabang tercapai
                  value:
                    success: false
                    message: "Paket \"Paket Basic\" Anda hanya mengizinkan maksimal 2 cabang. Anda sudah memiliki 2 cabang. Upgrade paket untuk menambah lebih banyak cabang."
      security:
        - bearerAuth: []
