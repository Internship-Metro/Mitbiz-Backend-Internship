  /transactions:
    post:
      tags:
        - Transaction
      summary: Buat Transaksi (BAYAR)
      description: |
        Buat Transaksi (BAYAR) - Folder: Transaction.
        Kalau customer mau langsung bayar, maka tambahkan body `paymentMethodId` dan `amountPaid`.

        **Kalkulasi Harga (Otomatis oleh Backend):**
        Backend menghitung total secara otomatis dalam urutan berikut:
        1. **Diskon per Produk** â€” harga tiap item dipotong berdasarkan `discount` yang sudah diset di master produk.
        2. **Diskon Global (Minimal Pembelian)** â€” jika fitur diskon aktif di pengaturan bisnis (`isDiscountEnabled: true`) dan `subtotal` mencapai `globalDiscountMinPurchase`, maka subtotal dipotong lagi sebesar `globalDiscountPercentage`.
        3. **Pajak** â€” pajak dihitung dari nilai setelah semua diskon.

        **Validasi Order Type:**
        - Jika `orderType` adalah `DINE_IN`, maka `customerName` dan `tableNumber` wajib diisi.
        - Jika `orderType` adalah `TAKE_AWAY`, maka hanya `customerName` yang wajib diisi.

        **Field tambahan yang akan muncul di Response:**
        - `queueNumber` — nomor urut antrean harian (reset tiap hari)
        - `globalDiscountPercentage` — persentase diskon global yang diterapkan (null jika tidak berlaku)
        - `globalDiscountAmount` — nominal (Rupiah) potongan diskon global yang diterapkan
      operationId: Transaction_Buat_Transaksi__BAYAR__post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              example:
                orderType: DINE_IN
                customerName: daffa
                tableNumber: "12"
                paymentMethodId: cmsotm1234000abc12def
                amountPaid: 36807
                items:
                  - productId: cmsotn5020004hs64jus09476
                    quantity: 3
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          description: Bad Request / Validasi Gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Unauthorized / Token Tidak Valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Forbidden / Hak Akses Ditolak
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Data Tidak Ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
        - bearerAuth: []
    get:
      tags:
        - Transaction
      summary: Riwayat Transaksi
      description: |
        Mengambil daftar riwayat transaksi. Perilaku berbeda berdasarkan Role pengguna yang login.

        **Kasir (STAFF):**
        - Otomatis hanya melihat transaksi di **outletnya sendiri** (dari token JWT).
        - Tidak bisa melihat transaksi outlet lain.
        - Response berupa **array transaksi** langsung.

        **Admin / Owner:**
        - Melihat **semua transaksi dari semua cabang** bisnisnya sekaligus.
        - Filter `?outletId=X` bersifat **opsional** untuk mempersempit ke satu cabang (dropdown "Semua Cabang").
        - Response berupa object dengan **summary stats** + **daftar transaksi**.

        **Format Response Admin:**
        ```json
        {
          "success": true,
          "data": {
            "summary": {
              "totalPenjualan": 30461227,
              "totalTransaksi": 390,
              "totalDiskon": 831879,
              "totalPajak": 2769106
            },
            "transactions": [ ... ]
          }
        }
        ```
      operationId: Transaction_Riwayat_Transaksi_get
      parameters:
        - name: outletId
          in: query
          required: false
          schema:
            type: string
          description: "**Opsional untuk Admin/Owner.** Filter ke satu cabang tertentu. Kasir tidak perlu mengisi ini (otomatis dari token)."
          example: "cmsotm1234000abc12def"
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
          description: "Filter transaksi yang mengandung produk dari kategori ini (dropdown 'Semua Kategori')."
          example: "cmcat123abc456def"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING, COMPLETED, VOIDED]
          description: "Filter berdasarkan status transaksi (dropdown 'Semua Status')."
          example: "COMPLETED"
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: "Pencarian berdasarkan No. Invoice, nama kasir, atau nama customer."
          example: "INV/2026/08"
        - name: shiftId
          in: query
          required: false
          schema:
            type: string
          description: "Filter berdasarkan ID shift tertentu (untuk Kasir)."
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: "Filter tanggal mulai (ISO 8601)."
          example: "2026-08-01T00:00:00.000Z"
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: "Filter tanggal akhir (ISO 8601)."
          example: "2026-08-31T23:59:59.999Z"
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    description: "Untuk Admin: object berisi summary + transactions. Untuk Kasir: array transaksi langsung."
                    properties:
                      summary:
                        type: object
                        description: "Hanya ada di response Admin/Owner."
                        properties:
                          totalPenjualan:
                            type: number
                            example: 30461227
                          totalTransaksi:
                            type: number
                            example: 390
                          totalDiskon:
                            type: number
                            example: 831879
                          totalPajak:
                            type: number
                            example: 2769106
                      transactions:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            invoiceNumber:
                              type: string
                              example: "INV/2026/08/172302302"
                            outlet:
                              type: object
                              properties:
                                id:
                                  type: string
                                name:
                                  type: string
                                  example: "Cabang Tangerang"
                            kasir:
                              type: object
                              properties:
                                name:
                                  type: string
                                  example: "Siti Rahayu"
                            paymentMethod:
                              type: object
                              properties:
                                name:
                                  type: string
                                  example: "Debit Card"
                                type:
                                  type: string
                                  example: "DEBIT"
                            totalAmount:
                              type: number
                              example: 42946
                            status:
                              type: string
                              example: "COMPLETED"
                            createdAt:
                              type: string
                              format: date-time
        "401":
          description: Unauthorized / Token Tidak Valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Forbidden / Hak Akses Ditolak
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
        - bearerAuth: []
