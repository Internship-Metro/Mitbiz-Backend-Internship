      operationId: Subscription_GetMy_get
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  data:
                    hasActiveSubscription: true
                    subscription:
                      id: cmc...
                      status: ACTIVE
                      startDate: 2026-08-18T00:00:00Z
                      endDate: 2026-09-18T00:00:00Z
                      isExpired: false
                      daysRemaining: 30
                      package:
                        name: Paket Starter
                        features: []
