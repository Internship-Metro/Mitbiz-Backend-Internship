      description: Admin Bisnis — lihat semua riwayat transaksi pembayaran paket
        (PENDING, SUCCESS, FAILED, EXPIRED) milik bisnis yang sedang login.
      operationId: Subscription_GetHistory_get
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  data:
                    - id: cmc...
                      orderId: SUB-1721300000000-abc123
                      grossAmount: 99000
                      paymentStatus: SUCCESS
                      paymentType: bank_transfer
                      paidAt: 2026-08-18T05:00:00Z
                      package:
                        name: Paket Starter
                        billingCycle: MONTHLY
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Token JWT diisi pada Authorization header (Format: Bearer <token>)"
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Berhasil melakukan operasi
        data:
          type: object
          nullable: true
        total:
          type: integer
          example: 10
    ApiErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Pesan kesalahan
        errors:
          type: array
          items:
            type: object
          nullable: true
