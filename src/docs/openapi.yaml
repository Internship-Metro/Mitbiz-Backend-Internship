  /auth/login:
    post:
      security: []
      tags:
        - Auth
        - Manajemen Karyawan (By Non - Super Admin)
      summary: Login
      description: |
        Login menggunakan email/username + password.
        
        Response sukses menyertakan:
        - `hasActiveSubscription` → `true/false/null` (null untuk Super Admin)
        - `activePackage` → detail paket aktif (nama, batas cabang, batas kasir, sisa hari)
        
        Frontend wajib cek `hasActiveSubscription`:
        - `false` → redirect ke halaman beli paket
        - `true` → redirect ke dashboard sesuai `portalTarget`
        - `null` → Super Admin, langsung ke panel Super Admin
      operationId: Auth_Login_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identifier
                - password
              properties:
                identifier:
                  type: string
                  description: Email (Admin) atau Username (Kasir)
                  example: daffarael351@gmail.com
                password:
                  type: string
                  example: dapaaa321
      responses:
        "200":
          description: Login berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Login berhasil
                  data:
                    type: object
                    properties:
                      requiresRegistration:
                        type: boolean
                        example: false
                      portalTarget:
                        type: string
                        enum: [ADMIN, POS, SUPER_ADMIN]
                        example: ADMIN
                      hasActiveSubscription:
                        type: boolean
                        nullable: true
                        description: |
                          `true` = punya langganan aktif, `false` = belum/expired,
                          `null` = Super Admin (tidak butuh langganan)
                        example: true
                      activePackage:
                        $ref: "#/components/schemas/ActivePackageInfo"
                      user:
                        $ref: "#/components/schemas/UserProfile"
                      tokens:
                        type: object
                        properties:
                          accessToken:
                            type: string
                          refreshToken:
                            type: string
        "400":
          description: Bad Request / Validasi Gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Unauthorized / Password salah atau akun tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Forbidden / Email belum diverifikasi atau akun dinonaktifkan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /auth/me:
    get:
      security:
        - bearerAuth: []
      tags:
        - Auth
      summary: Profil Yang Sedang Login (GET /me)
      description: |
        Ambil profil user yang sedang login beserta status langganan bisnisnya.
        
        Response menyertakan `hasActiveSubscription` dan `activePackage` — 
        berguna untuk frontend cek apakah perlu redirect ke halaman beli paket.
      operationId: Auth_Profil_Yang_Sedang_Login_get
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: clxxx123
                      name:
                        type: string
                        example: Daffarael
                      email:
                        type: string
                        nullable: true
                        example: daffarael351@gmail.com
                      role:
                        type: string
                        enum: [SUPER_ADMIN, ADMIN, STAFF]
                        example: ADMIN
                      businessId:
                        type: string
                        nullable: true
                      outletId:
                        type: string
                        nullable: true
                      avatarUrl:
                        type: string
                        nullable: true
                      hasActiveSubscription:
                        type: boolean
                        nullable: true
                        description: |
                          `true` = langganan aktif, `false` = belum/expired,
                          `null` = Super Admin (tidak butuh langganan)
                        example: true
                      activePackage:
                        $ref: "#/components/schemas/ActivePackageInfo"
        "401":
          description: Unauthorized / Token Tidak Valid
          content:
